[project]
name = "distributed-task-executor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fakeredis>=2.37.1",
    "pydantic>=2.13.5",
]

[project.scripts]
distributed-task-executor = "distributed_task_executor.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
]

[tool.importlinter]
root_package = "distributed_task_executor"

[[tool.importlinter.contracts]]
name = "Dependency rule"
type = "layers"
containers = ["distributed_task_executor"]
exhaustive = true
layers = [
    "cli",
    "services | adapters",
    "application",
    "core",
]
